name: CI

on:
  push:
    branches: [main, ci, gary]
  pull_request:

jobs:
  backend:
    name: Backend (TypeScript Check + Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: backend
        run: pnpm lint

      - name: Type check
        working-directory: backend
        run: pnpm typecheck

      - name: Build
        working-directory: backend
        run: pnpm build

  frontend:
    name: Frontend (Lint + Typecheck + Test + Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: foundit-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: foundit-ui
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: foundit-ui
        run: pnpm lint

      - name: Type check
        working-directory: foundit-ui
        run: pnpm typecheck

      - name: Test
        working-directory: foundit-ui
        run: pnpm test

      - name: Build
        working-directory: foundit-ui
        run: pnpm build

  format:
    name: Prettier Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        stack: [bootstrap, main]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12"

      - name: Format check
        working-directory: infra/${{ matrix.stack }}
        run: terraform fmt -check -recursive

      - name: Init (no backend, no credentials needed — syntax/schema check only)
        working-directory: infra/${{ matrix.stack }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: infra/${{ matrix.stack }}
        run: terraform validate

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [backend, frontend, format]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: SSH in and run redeploy.sh
        uses: appleboy/ssh-action@v1
        with:
          host: foundit.garychang1214.com
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: sudo /opt/foundit/redeploy.sh
